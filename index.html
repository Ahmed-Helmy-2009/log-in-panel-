<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberCrime Portal</title>
    <style>
        body {
            background: #0f172a;
            font-family: Arial, sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            width: 320px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #38bdf8;
        }

        input {
            width: 320px;
            padding: 10px;
            margin: 10px 0;
            border: none;
            border-radius: 6px;
            outline: none;
            background: #334155;
            color: white;
        }

        input::placeholder {
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #0ea5e9;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Team Login</h2>
    <form onsubmit="handleSubmit(event)">
        <input type="text" placeholder="Team Name" required>
        <input type="text" placeholder="Team Leader" required>
        <input type="password" placeholder="Password" required>
        <!--   -->
        <button type="submit">Reveal Flag</button>
    </form>
</div>

<script>
    function handleSubmit(event) {
        event.preventDefault();
        alert("Flag??? ahhh not that easy, you're so naive. Try to impersonate the investigator. Search for a method to contact the website");
    }
</script>

</body>
</html>
